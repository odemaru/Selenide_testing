junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=2

# Потолок пула, без которого параллелизм не значит ничего.
#
# Тесты блокируются на сети и на браузере, и ForkJoinPool на каждую такую
# блокировку заводит компенсирующий поток, чтобы удержать заявленный
# параллелизм. Верхняя граница по умолчанию — parallelism + 256. Selenide
# держит драйвер на поток, поэтому потоки превращаются в браузеры: при
# parallelism=2 в прогоне насчитывалось 24 живых процесса chromedriver,
# машина захлёбывалась, и страницы переставали успевать отрисоваться.
# Отсюда были все падения «элемент не найден».
junit.jupiter.execution.parallel.config.fixed.max-pool-size=2
junit.jupiter.execution.parallel.config.fixed.saturate=true

junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores
