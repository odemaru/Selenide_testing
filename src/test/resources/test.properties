base.url=https://practicesoftwaretesting.com
api.url=https://api.practicesoftwaretesting.com

browser=chrome
headless=true
window.size=1440x900

# Запас на медленный отклик демо-стенда. Отдельная страница отвечает за
# три-четыре секунды, но прогон идёт в четыре потока по общему внешнему
# стенду, и под такой нагрузкой отклик доходит до десяти. На восьми секундах
# прогон разваливался ложными падениями «элемент не найден».
timeout.ms=15000
