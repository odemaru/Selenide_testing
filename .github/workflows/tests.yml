name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Еженедельный прогон. Тесты идут по внешнему стенду, который меняется
    # без предупреждения: так о поломке станет известно раньше, чем от него
    # что-то понадобится. Заодно @KnownBug сообщит об исправленном дефекте.
    - cron: "0 6 * * 1"

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Драйвер Selenium Manager подбирает сам, но браузер должен быть в системе.
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Прогнать тесты
        run: ./mvnw -B test -Dheadless=true -Dthreads=2

      - name: Сохранить результаты прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      # Скриншоты и разметка страниц на момент падения: без них разбирать
      # упавший прогон в CI нечем.
      - name: Сохранить артефакты падений
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenide-reports
          path: target/selenide-reports
          retention-days: 14
