# Правка официального prod-компоуза магазина под прогон в CI.
#
# Образы web и cron авторы опубликовали только под arm64 и не обновляли
# с июля 2025, а раннеры GitHub работают на amd64: контейнеры падают
# с «exec format error», API остаётся недоступным, и прогон не начинается.
# Образы api и ui собраны под amd64 и берутся как есть.
#
# web — это nginx с одним файлом конфигурации, он собирается из исходников
# магазина за считанные секунды. cron гоняет отложенные задачи и тестам
# не нужен, поэтому просто не поднимается.
services:
  web:
    build:
      context: ./_docker
      dockerfile: web.docker

  cron:
    profiles: ["not-used-in-ci"]
